name: check

on:
  push:
    branches: [main]
  pull_request:
  # For the `schemas` job below: the limit it checks is the provider's to move,
  # so it has to be re-asked on a timer rather than on a commit.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + lint + test + plans:verify
      - run: pnpm check

      # The spec is generated from the running worker, and orval reads the
      # committed copy — so a stale spec silently means a stale web client.
      # Kept out of `check` because it boots a worker, which a contributor
      # without wrangler set up cannot do.
      - run: pnpm openapi:verify

  # No breaking change to /v1 ships by accident.
  #
  # `/v1` is promised to keep meaning what it means (versioning.mdx), and the spec
  # is generated from the routes, so comparing this commit's openapi.json with the
  # one before it is the whole check. Only /v1 is compared: /api and /p are ours to
  # change. A deliberate break, or a documentation fix oasdiff cannot tell from one
  # (declaring a body the route always required), goes through by putting
  # `[api-break]` in the commit message or PR title, which still prints the report.
  breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install oasdiff
        run: curl -sSL https://github.com/oasdiff/oasdiff/releases/download/v1.33.0/oasdiff_1.33.0_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin oasdiff
      - name: Compare /v1 with the previous spec
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OVERRIDE: ${{ contains(github.event.head_commit.message, '[api-break]') || contains(github.event.pull_request.title, '[api-break]') }}
        run: |
          if ! git show "$BASE:openapi.json" > /tmp/base.json 2>/dev/null; then
            echo "No previous spec to compare against."
            exit 0
          fi
          if [ "$OVERRIDE" = "true" ]; then
            oasdiff breaking /tmp/base.json openapi.json --match-path '^/v1/'
            exit 0
          fi
          oasdiff breaking /tmp/base.json openapi.json --match-path '^/v1/' --fail-on ERR

  # Asks the provider whether it still accepts the schemas we send it.
  #
  # Separate from `check` and on a schedule, because the thing it guards against
  # is not a commit. Google budgets structured-output schemas and tightened that
  # budget under schemas that had been measured against it: form generation broke
  # in production with no deploy, no failing test, and no change on our side. Only
  # the provider knows the current limit, so the only way to find out before a
  # customer does is to ask it on a timer.
  #
  # Needs OPENROUTER_API_KEY. Costs a handful of cheap calls per run. `continue-
  # on-error` is deliberately NOT set — a refusal here means the feature is
  # broken or one schema change away from it.
  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/api check:schemas
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
